spring.application.name=almacen-backend

server.port=8080
server.servlet.context-path=/api/v1

# Conexión JDBC al contenedor Docker
spring.datasource.url=jdbc:mysql://localhost:3309/almacen_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=almacen_user
spring.datasource.password=almacen_dev_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true